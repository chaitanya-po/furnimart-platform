apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-deployment
  namespace: furnimart
  labels:
    app: catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: catalog
          image: furnimart-catalog:6
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 8000

          envFrom:
            - configMapRef:
                name: catalog-config

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"